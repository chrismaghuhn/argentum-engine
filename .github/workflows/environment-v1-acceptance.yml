name: Environment V1 Acceptance

on:
  workflow_dispatch:

jobs:
  exact-pair-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Environment V1 acceptance
        run: ./gradlew :gym:environmentV1AcceptanceTest
