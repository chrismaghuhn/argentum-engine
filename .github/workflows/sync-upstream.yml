name: Monitor Upstream

on:
  schedule:
    # Upstream moves quickly; monitor hourly without mutating fork main.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-monitor-main
  cancel-in-progress: false

jobs:
  monitor:
    if: github.repository == 'chrismaghuhn/argentum-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout fork main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch upstream main
        run: |
          git remote add upstream https://github.com/wingedsheep/argentum-engine.git
          git fetch --prune upstream main

      - name: Report upstream status
        shell: bash
        run: |
          FORK_SHA="$(git rev-parse HEAD)"
          UPSTREAM_SHA="$(git rev-parse upstream/main)"
          BEHIND_COUNT="$(git rev-list --count HEAD..upstream/main)"

          {
            echo "## Upstream monitor"
            echo
            echo "- Fork main: \`${FORK_SHA}\`"
            echo "- Upstream main: \`${UPSTREAM_SHA}\`"
            echo "- Upstream-only commits: \`${BEHIND_COUNT}\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Fork main already contains upstream/main." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "New upstream work is available."
            echo
            echo "This workflow is intentionally monitor-only. It MUST NOT merge or push live upstream/main."
            echo "Start a separately characterized synchronization cycle with an explicitly pinned upstream SHA."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::warning title=New upstream commits detected::${BEHIND_COUNT} upstream commit(s) are not contained in fork main. Use a pinned upstream-sync cycle; this workflow will not merge them."
