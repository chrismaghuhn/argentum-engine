[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "argentum-ml"
version = "0.1.0"
description = "Argentum C1 derived learner contracts"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.optional-dependencies]
learner = [
    "torch==2.14.0",
    "safetensors==0.8.0",
    "trackio==0.37.1",
    # Pinned to the exact huggingface-hub release proven green with trackio==0.37.1 in
    # hosted CI run 35180540943; 1.32.0 broke the trackio import chain
    # (ImportError: cannot import name 'CommitOperationAdd' from 'huggingface_hub.hf_api',
    # hosted CI run 35285396688). Reproducible dependency closure, not an upgrade.
    "huggingface-hub==1.31.0",
]

[tool.setuptools.packages.find]
where = ["src"]
